services:
  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: magazord_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: magazord_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magazord_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: